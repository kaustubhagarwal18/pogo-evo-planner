name: tests

# Runs everything in tests/ on every push, on any branch, and on demand from the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # see every Python version's result, not just the first failure
      matrix:
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System OCR (Tesseract)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - name: Install
        run: pip install -e '.[llm,dev]'   # llm: the Claude/Ollama tests use fake clients, no API key
      - name: Run tests/ (Tesseract backend)
        run: python -m pytest tests -v -p no:cacheprovider

  test-rapidocr:
    # The recommended OCR backend. Non-blocking until it has been calibrated on real screens.
    name: test (RapidOCR)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install -e '.[ocr,dev]'
      - name: Run tests/ (RapidOCR backend)
        run: python -m pytest tests -v -p no:cacheprovider
