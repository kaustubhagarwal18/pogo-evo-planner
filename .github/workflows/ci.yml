name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System OCR fallback
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check rarecandy tests
      - name: Test (Tesseract backend)
        run: python -m unittest discover -s tests -t . -v

  test-rapidocr:
    # The recommended backend. Kept non-blocking until it has been calibrated on real screens.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install -e '.[ocr,dev]'
      - run: python -m unittest discover -s tests -t . -v
