[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rarecandy"
version = "0.1.0"
description = "Pokémon GO evolution and Rare Candy planner, fed by OCR of screenshots and screen recordings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # the planner is pure stdlib

[project.optional-dependencies]
# screen scanning: OpenCV for frames and image handling
scan = ["opencv-python-headless>=4.8", "numpy>=1.24"]
# recommended OCR + fuzzy matching (without these, Tesseract and difflib are used)
ocr = ["rarecandy[scan]", "rapidocr>=2", "onnxruntime>=1.16", "rapidfuzz>=3"]
dev = ["rarecandy[scan]", "pillow>=10", "pytest>=8", "ruff>=0.5"]

[project.scripts]
rarecandy = "rarecandy.cli:main"

[tool.setuptools.packages.find]
include = ["rarecandy*"]

[tool.setuptools.package-data]
rarecandy = ["data/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
